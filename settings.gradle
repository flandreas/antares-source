/* Multi-project build of jabbah */

include 'base'
include 'io'
include 'animation'
include 'draw'
include 'edit'
include 'execution'
include 'app'
include 'graph'
include 'antares'

rootProject.name = 'jabbah'

rootProject.children.each { project ->

/* gradle build file of the jabbah project */

buildscript {
    ext.kotlin_version = '1.2.51'
    ext.mockito_version = '2.19.0'
    ext.mockito_kotlin_version = '2.0.0-RC1'
    repositories {
        mavenCentral()
        jcenter()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'org.asciidoctor:asciidoctor-gradle-plugin:1.5.3'
    }
}

apply plugin: 'idea'
apply plugin: 'kotlin'
apply plugin: 'org.asciidoctor.convert'

allprojects {
	repositories {
		mavenCentral()
	}
}

asciidoctor {
    sourceDir = file('doc/jabbah')
    outputDir = file('build/doc')
    resources {
        from('doc') {
            include 'model-img/svg/*'
        }
    }
}


  <strong>Gerade</strong>: Dieses Layout erzeugt keine Zwischenpunkte.<br> \
  <strong>Orthogonal</strong>: Die Verbindung wird aus orthogonalen Segmenten aufgebaut, die der Benutzer einzeln verschieben kann.

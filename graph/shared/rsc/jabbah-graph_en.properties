  but the inputs in the symbol are located on the left side of the symbol.
graph.property.mirrorVertically.name = Mirror Vertically
graph.property.mirrorVertically.desc = Mirrors the symbol in vertical direction (or on the horizontal axis through the origin of the symbol). \
  This is useful e.g. if wires with input signals arrive from above in the using circuit, \
  but the inputs in the symbol are located at the lower side of the symbol.


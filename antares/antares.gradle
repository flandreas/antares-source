apply plugin: 'kotlin'

sourceSets {
    main.kotlin.srcDirs += 'shared/src/main'
    main.resources.srcDirs += 'shared/rsc'
    main.kotlin.srcDirs += 'jvm/src/main'

    test.kotlin.srcDirs += 'shared/src/test'
    test.resources.srcDirs += 'shared/rsc'
    test.kotlin.srcDirs += 'jvm/src/test'
}

repositories {
    flatDir {
        dirs '../lib'
    }
}

dependencies {
    compile project(':base')
    compile project(':animation')
    compile project(':io')
    compile project(':draw')
    compile project(':edit')
    compile project(':execution')
    compile project(':app')
    compile project(':graph')

    compile 'org.slf4j:slf4j-api:1.7.21'
    compile "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    compile "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"

    testCompile 'junit:junit:4.12'
    testCompile 'org.hamcrest:hamcrest-core:1.3'
    testCompile 'org.hamcrest:hamcrest-library:1.3'
    testCompile "org.mockito:mockito-core:2.7.2"
    testCompile "org.jetbrains.kotlin:kotlin-test:$kotlin_version"
    testCompile "org.jetbrains.kotlin:kotlin-test-junit:$kotlin_version"
    testCompile "com.nhaarman:mockito-kotlin:1.2.0"

    // The following dependencies don't work, for any reason..
    // Depending on TestTranslationsBuilder
    //testCompile project(':base').sourceSets.test.output
    // Depending on StyleProviderMockBuilder
    //testCompile project(':draw').sourceSets.test.output
    // Depending on TestEditorBuilder
    //testCompile project(':edit').sourceSets.test.output
}

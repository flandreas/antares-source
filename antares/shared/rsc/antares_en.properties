element.property.SevenSegmentDisplayScheme.name = Pin Scheme
element.property.SevenSegmentDisplayScheme.desc = This attribute is only available if the attribute "Size" has the value "large". \
  It determines whether a separate pin should be provided for each segment of the LED (value "Single"), \
  or whether all 7 segments should be combined into a single 8-bit pin (value "Combined").
element.property.SevenSegmentDisplayScheme.single = Separate
element.property.SevenSegmentDisplayScheme.combined = Combined
element.property.Constant.value.name = Value (decimal)
element.property.Constant.value.desc = The decimal value of this constant. If the bit width is not big enough to represent this value, it gets truncated accordingly.
element.property.TriStateBuffer.handedness.name = Control Input Orientation
element.property.TriStateBuffer.handedness.desc = Determines on which side of the component the control input is displayed.<br> \
  <strong>Right</strong>: The control input is displayed on the right side as seen from the data flow direction.<br> \
  <strong>Left</strong>: The control input is displayed on the left side as seen from the data flow direction.<br>
element.property.handedness.right = Right
element.property.handedness.left = Left
element.property.Splitter.handedness.name = Position Bit 0
element.property.Splitter.handedness.desc = Used to determine the position of the outputs within the splitter.<br> \
  <strong>Right</strong>: The output carrying bit 0 is located on the right side of the splitter from the point of view of the signal arriving at the input.<br> \
  <strong>Left</strong>: The output carrying the bit 0 is on the left side of the splitter from the point of view of the signal arriving at the input. 
element.property.hasOutput.name = Has Output
element.property.hasOutput.desc = If set, the probe has an additional output pin, which can be used to put the probe inside a wire.
element.property.DigitalPortViewComponent.showBitWidthAnnotation.name = Show Bit Width
element.property.DigitalPortViewComponent.showBitWidthAnnotation.desc = If set, the pin displays a bit width annotation.
element.property.CircuitOutput.triState.name = Tri-State Output
element.property.CircuitOutput.triState.desc = If set, the pin has tri-state behaviour and can be be connected with other outputs
element.property.DelayGate.delay.name = Delay (ns)
element.property.DelayGate.delay.desc = The time in nanosecond after a new signal at the input arrives at the output.
element.property.RAM.clock.name = Clock Input
element.property.RAM.clock.desc = If this attribute is set, the RAM contains the "CLK" pin.
element.property.outputPort.name = Output Name
element.property.outputPort.desc = The optional name displayed next to the output. This can be useful if the gate is the end of a complex combinatorial circuit and the logical expression produced by the gate is to be specified.
element.property.LEDMatrix.afterglow.name = Afterglow duration (ms)
element.property.LEDMatrix.afterglow.desc = The duration in milliseconds that a light dot continues to glow after \
  the corresponding values at the inputs have been set to 0. If the LED matrix is operated in multiplexing mode, \
  this value must match the frequency at which the input values change.
element.property.columns.name = Number of columns
element.property.columns.desc = Determines the number of columns of the LED matrix. \
  The attribute can have a value between 1 and 64, which also determines the bit width of the "C" pin.
element.property.rows.name = Number of rows
element.property.rows.desc = Determines the number of rows of the LED matrix. \
  The attribute can have a value between 1 and 64. This value also determines the bit width of the "R" pin.
element.property.isDebug.name = Debug
element.property.isDebug.desc = If this attribute is set, the LED matrix shows during simulation which rows and columns \
  at the inputs have the value 1 at the moment, which can be helpful for debugging, \
  but also for educational purposes, if e.g. a multiplexing circuit is developed.
element.property.LEDMatrix.isCircleDots.name = Draw dots as circle
element.property.LEDMatrix.isCircleDots.desc = Normally Antares draws the light dots as small rectangles without any space between the individual dots. \
  If this attribute is set, small circles are drawn instead.
element.property.AndGate.dataPort.name = Data Input
element.property.AndGate.dataPort.desc = In this attribute the number of the input containing the data path can be selected if the feature "Data Path" is to be used. In the direction of data flow through the AND gate, number 1 designates the left-most input.
element.property.OutputAnnotation.none = None

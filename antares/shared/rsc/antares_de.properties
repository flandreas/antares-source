element.property.inputCount.desc = Die Anzahl Eingänge dieses Gatters (bis zu 8). Kann auch geändert werden, wenn Eingänge mit Leitungen verbunden sind.

element.property.LEDColor.name = LED-Farbe
element.property.LEDColor.desc = Die Farbe, in der die LED leuchtet.
element.property.ClockView.period.name = Periode (µs)
element.property.ClockView.periodOrFrequency.name = Periode/Frequenz
element.property.ClockView.periodOrFrequency.desc = Betrag gefolgt von Einheit. Gültige Einheiten sind s, ms, us, ns, Hz, kHz, MHz, GHz.
element.property.periodOrFrequency.invalidUnit.text = Ungültige Einheit ''{0}'' für Periode/Frequenz
element.property.periodOrFrequency.invalidValue.text = Ungültiger Betrag ''{0}'' für Periode/Frequenz
element.property.ClockView.enabled.name = Aktiv
element.property.ClockView.enabled.desc = Falls nicht gesetzt, bleibt der Ausgang während der Simulation immer auf 0.
element.property.ClockView.knobEnabled.name = Periode während Simulation ändern
element.property.ClockView.knobEnabled.desc = Der Drehknopf, mit dem der Benutzer die Periode während der Simulation ändern kann, \
  wird nur angezeigt, wenn diese Eigenschaft ausgewählt ist.
element.property.logic.name = Logik
element.property.logic.desc = Bestimmt das Logik-Verhalten eines Kontrolleingangs.<br> \
  <strong>Positiv</strong>: Der Kontrolleingang ist mit dem Signal 1 aktiv.<br> \
  <strong>Negativ</strong>: Der Kontrolleingang ist mit dem Signal 0 aktiv.<br>
element.property.logic.positive = Positiv
element.property.logic.negative = Negativ
element.property.trigger.name = Steuerung
element.property.trigger.desc = Mit "Taktflanke" wird im Symbol ein kleines Dreieck für diesen Anschluss angezeigt.
element.property.trigger.level = Taktzustand
element.property.trigger.edge = Taktflanke
element.property.bitWidth.name = Anzahl Bits
element.property.bitWidth.desc = Die Anzahl Bits, aus denen verarbeitete Signale bestehen.
element.property.addressBitWidth.name = Anzahl Bits in Adresse
element.property.addressBitWidth.desc = Die Anzahl Bits, aus denen die Adressen der Speicherkomponente bestehen. \
  Dieser Wert bestimmt ebenfalls die Anzahl Speicherzellen, die die Speicherkomponente enthält 
element.property.dataBitWidth.name = Anzahl Bits in Daten
element.property.dataBitWidth.desc = Die Anzahl Bits in jeder Speicherzelle.
element.property.branchCount.name = Auffächerung
element.property.branchCount.desc = Spezifiziert die Anzahl Ausgänge. Die Anzahl Bits jedes Ausgangs wird durch die Formel "Anzahl Bits" / "Auffächerung" bestimmt.
element.property.DigitalSignalRepresentation.name = Repräsentation
element.property.DigitalSignalRepresentation.desc = Die Art, in der digitale Signale numerisch dargestellt werden (Binär, Dezimal, Hexadezimal).
element.property.DigitalSignalRepresentation.binary = Binär
element.property.DigitalSignalRepresentation.decimal = Dezimal
element.property.DigitalSignalRepresentation.hexadecimal = Hexadezimal
element.property.SevenSegmentDisplayScheme.name = Anschluss-Schema
element.property.SevenSegmentDisplayScheme.desc = Diese Eigenschaft ist nur verfügbar, wenn "Grösse" den Wert "Gross" hat. \
  Es bestimmt, ob für jedes Segment der Anzeige ein separater Anschluss bereitgestellt werden soll ("Einzeln"), \
  oder ob die Anschlüsse für alle 7 Segmente in einem einzigen 8-Bit-Anschluss kombiniert werden sollen ("Kombiniert").
element.property.SevenSegmentDisplayScheme.single = Einzeln
element.property.SevenSegmentDisplayScheme.combined = Kombiniert
element.property.Constant.value.name = Wert (dezimal)
element.property.Constant.value.desc = Der dezimale Wert der Konstante. Reicht die Anzahl Bits nicht aus, diesen Wert darzustellen, wird er entsprechend abgeschnitten.
element.property.TriStateBuffer.handedness.name = Ausrichtung Kontrolleingang
element.property.TriStateBuffer.handedness.desc = Bestimmt, auf welcher Seite der Komponente der Kontrolleingang dargestellt wird.<br> \
  <strong>Rechts</strong>: Der Kontrolleingang wird aus Sicht des Datenflusses auf der rechten Seite dargestellt.<br> \
  <strong>Links</strong>: Der Kontrolleingang wird aus Sicht des Datenflusses auf der linken Seite dargestellt.<br>
element.property.handedness.right = Rechts
element.property.handedness.left = Links
element.property.Splitter.handedness.name = Position Bit 0
element.property.Splitter.handedness.desc = Definiert die Positionen der Ausgänge innerhalb des Verteilers.<br> \
  <strong>Rechts</strong>: Der Ausgang mit Bit 0 befindet sich am rechten Rand des Verteilers aus Sicht des ankommenden Signals.<br> \
  <strong>Links</strong>: Der Ausgang mit Bit 0 befindet sich am linken Rand des Verteilers aus Sicht des ankommenden Signals.
element.property.hasOutput.name = Hat Ausgang
element.property.hasOutput.desc = Falls gesetzt, hat die Sonde einen zusätzlichen Ausgang, was verwendet werden kann, um die Sonde innerhalb einer Leitung zu plazieren.
element.property.DigitalPortViewComponent.showBitWidthAnnotation.name = Anzahl Bits anzeigen
element.property.DigitalPortViewComponent.showBitWidthAnnotation.desc = Falls gesetzt, zeigt der Anschluss die Anzahl Bits an.
element.property.CircuitOutput.triState.name = Tri-State-Ausgang
element.property.CircuitOutput.triState.desc = Falls gesetzt, hat der Ausgang Tri-State-Verhalten und kann mit anderen Ausgängen verbunden werden.
element.property.DelayGate.delay.name = Verzögerung (ns)
element.property.DelayGate.delay.desc = Die Zeit in Nanosekunden, bis ein neues Signal am Eingang den Ausgang erreicht.
element.property.RAM.clock.name = Takteingang
element.property.RAM.clock.desc = Falls gesetzt, hat die RAM-Komponente einen Takteingang "CLK".
element.property.outputPort.name = Name des Ausgangs
element.property.outputPort.desc = Der optionale Name des Ausgangs. Kann nützlich sein, wenn das Gatter am Ende einer komplexen kombinatorischen Schaltung steht und der berechnete logische Ausdruck angezeigt werden soll.
element.property.LEDMatrix.afterglow.name = Nachleuchtdauer (ms)
element.property.LEDMatrix.afterglow.desc = Die Dauer in Millisekunden, die ein Leuchtpunkt nachleuchtet, \
  nachdem das entsprechende Eingangssignal auf 0 zurückgegangen ist. Wenn die LED-Matrix im Multiplex-Modus betrieben wird, \
  muss dieser Wert an die Frequenz angepasst werden, mit der die Eingangssignale ändern.
element.property.columns.name = Anzahl Spalten
element.property.columns.desc = Die Anzahl Spalten der LED-Matrix zwischen 1 und 64. \
  Bestimmt gleichzeitig die Bit-Anzahl des Eingangs "C"
element.property.rows.name = Anzahl Zeilen
element.property.rows.desc =  Die Anzahl Zeilen der LED-Matrix zwischen 1 und 64. \
  Bestimmt gleichzeitig die Bit-Anzahl des Eingangs "R"
element.property.isDebug.name = Debug
element.property.isDebug.desc = Falls gesetzt, zeigt die LED-Matrix zu jedem Zeitpunkt an, \
  welche Zeilen und Spalten durch Signale an den Eingängen adressiert werden. Dies ist nützlich für Fehlersuche, \
  aber auch für didaktische Zwecke bei der Entwicklung einer Multiplexer-Steuerung.
element.property.LEDMatrix.isCircleDots.name = Leuchtpunkt als Kreis
element.property.LEDMatrix.isCircleDots.desc = Antares zeichnet die Leuchpunkte normalerweise als Rechtecke ohne Abstand zwischen den einzelnen Punkten. \
  Wenn diese Eigenschaft gesetzt ist, werden die Leuchtpunkte als Kreis gezeichnet.
element.property.AndGate.dataPort.name = Daten-Eingang
element.property.AndGate.dataPort.desc = Spezifiziert die Nummer des Eingangs, der die Nutz-Daten empfängt, wenn das Feature "Daten-Fluss" des UND-Gatters verwendet wird. Bezüglich der Richtung, in der die Daten durch das UND-Gatter fliessen, bezeichnet die Nummer 1 den Eingang auf der linken Seite.
element.property.outputAnnotation.name = Annotation Ausgang
element.property.outputAnnotation.desc = Abhängig vom Wert wird für diesen Anschluss innerhalb des Symbols die entsprechende Annotation angezeigt.
element.property.OutputAnnotation.none = Keine
element.property.OutputAnnotation.triState = Tri-State
element.property.OutputAnnotation.masterSlave = Master-Slave
element.property.Switch.toggle.name = Umschalten
element.property.Switch.toggle.desc = Falls gesetzt (Default), bleibt der Schalter eingeschaltet, nachdem der Benutzer die Maustaste (resp. die Tastatur-Taste) losgelassen hat.
element.property.Addressable.showContents.name = Inhalt anzeigen
element.property.Addressable.showContents.dest = Bestimmt, ob die Speicherkomponente Teile des Speicherinhalts innerhalb des Symbols anzeigen soll.
element.property.Addressable.rowsCount.name = Anzahl Inhalts-Zeilen
element.property.Addressable.rowsCount.desc = Kann nur zusammen mit "Inhalt anzeigen" verwendet werden. Bestimmt die Anzahl Zeilen, wenn Speicherinhalt im Symbol angezeigt wird.
element.property.Addressable.columnsCount.name = Anzahl Inhalts-Spalten
element.property.Addressable.columnsCount.desc = Kann nur zusammen mit "Inhalt anzeigen" verwendet werden. Bestimmt die Anzahl Spalten, wenn Speicherinhalt im Symbol angezeigt wird.
element.property.ROM.disassemblerConfig.name = Disassembler-Konfiguration
element.property.ROM.disassemblerConfig.desc = Eine Liste von regulären Ausdrücken, die durch Zeilenumbrüche getrennt sind. \
  Siehe das Benutzerhandbuch für mehr Informationen.
element.property.ROM.disassemblerDisplay.name = Disassembler anzeigen
element.property.ROM.disassemblerDisplay.desc = Kann nur zusammen mit "Inhalt anzeigen" verwendet werden. Falls gesetzt, \
  werden Speicherzellen gemäss der "Disassembler-Konfiguration" interpretiert und das Ergebnis als zusätzliche Spalte angezeigt.
element.property.ROM.highlightCurrentCellWhenNotSelected.name = Aktuelle Zelle auch ohne CS anzeigen
element.property.ROM.highlightCurrentCellWhenNotSelected.desc = Falls gesetzt, bleibt die aktuell adressierte Zelle hervorgehoben, selbst wenn der Eingang "CS" auf 0 geht.
element.property.bufferSize.name = Puffergrösse

library.element.OddFunction.desc = Der Ausgang ist nur dann 1, wenn die Anzahl Eingänge mit 1 ungerade ist
library.element.XnorGate.name = Äquivalenz (XNOR)
library.element.XnorGate.desc = Der Ausgang ist nur dann 1, wenn alle Eingänge gleich sind
library.element.EvenFunction.name = Gerade Funktion
library.element.EvenFunction.desc = Der Ausgang ist nur dann 1, wenn die Anzahl Eingänge mit 1 gerade ist

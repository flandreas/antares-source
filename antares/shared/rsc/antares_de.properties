library.element.LED.name = LED
library.element.LED.desc = Leuchtet bei 1, ist dunkel bei 0.
library.element.RgbLED.name = RGB-LED
library.element.RgbLED.desc = Der 24-Bit-Eingang liefert den RGB-Wert der Farbe, in der die LED leuchtet
library.element.Toggle.name = Schalter
library.element.Toggle.desc = Schaltet zwischen den Zuständen 0 und 1 hin und her
library.element.Switch.name = Taster
library.element.Switch.desc = Schaltet beim Drücken auf 1 und beim Loslassen zurück auf 0
library.element.Clock.name = Taktgeber
library.element.Clock.desc = Erzeugt ein Signal, das periodisch zwischen 0 und 1 wechselt
library.element.SevenSegmentDisplay.name = 7-Segment-Anzeige
library.element.SevenSegmentDisplay.desc = Besteht aus 7 einzelnen LEDs, die in Form einer Ziffer angeordnet sind
library.element.GraphInOut.name = Eingang/Ausgang

  <strong>N</strong>: N-Kanal MOS (NMOS) logic. Leitet das Signal vom Source-Eingang zum Drain-Ausgang weiter, falls Gate 1 ist.<br>
element.property.transistorType.p.name = P
element.property.transistorType.n.name = N


antares.keyboard.availablePort.desc = ''Available''. Zeigt mit 1 an, dass mind. ein Zeichen im Puffer enthalten ist.
antares.keyboard.clearPort.desc = ''Clear''. Mit 1 wird der Inhalt des Puffers gelöscht.
antares.keyboard.enablePort.desc = ''Enable''. Mit 1 wird die Ausgabe des nächsten Zeichens am Ausgang D ermöglicht, wenn CLK auf 1 geht.
antares.keyboard.clockPort.desc = ''Clock''. Bei steigender Flanke wird das nächste Zeichen am Ausgang D ausgegeben, falls EN gesetzt ist.
antares.keyboard.dataPort.desc = ''Data''. An diesem Ausgang wird das erste Zeichen des Puffers ausgegeben.

antares.terminal.clockPort.desc = ''Clock''. Bei steigender Flanke wird das nächste Zeichen vom Eingang D gelesen, falls EN gesetzt ist.
antares.terminal.clearPort.desc = ''Clear''. Mit 1 wird der ganze Inhalt des Terminals gelöscht.
antares.terminal.enablePort.desc = ''Enable''. Mit 1 wird die Übernahme von Zeichen vom Eingang D ermöglicht.
antares.terminal.dataPort.desc = ''Data''. Liest das nächste Zeichen, das dargestellt werden sollen.

antares.sevenSegment.segmentsPort.desc = Steuert die 7 Segmente, wobei Bit 0 dem Segment ''a'' und Bit 7 dem Segment ''g'' entspricht.
antares.sevenSegment.pointPort.desc = Dezimalpunkt.

antares.ledMatrix.columnsPort.desc = Spaltenadresse, wobei Bit 0 der Spalte ganz rechts entspricht.
antares.ledMatrix.rowsPort.desc = Zeilenadresse, wobei Bit 0 der Zeile ganz unten entspricht.

antares.rom.addressPort.desc = Adresse der angesprochenen Speicherzelle.
antares.rom.chipSelectPort.desc = ''Chip Select''. Mit 1 werden Daten ausgelesen.
antares.rom.dataPort.desc = Datenausgang. Gibt die Daten der Speicherzelle aus, die mit Eingang A adressiert wird.

antares.ram.addressPort.desc = Adresse der angesprochenen Speicherzelle.
antares.ram.chipSelectPort.desc = ''Chip Select''. Daten können nur gelesen oder geschrieben werden, wenn der Eingang 1 ist.
antares.ram.dataPort.desc = ''Data''. Enthält die Daten, die gelesen oder geschrieben werden.
antares.ram.writePort.desc = ''Write''. Mit 1 werden Daten geschrieben, mit 0 werden Daten gelesen.
antares.ram.clearPort.desc = ''Clear''. Mit 1 werden alle Daten im RAM gelöscht.
antares.ram.clockPort.desc = ''Clock''. Mit steigender Flanke werden Daten gelesen oder geschrieben.

antares.random.clockPort.desc = ''Clock''. Mit jeder steigender Flanke wird eine neue Zufallszahl am Ausgang erzeugt.
antares.random.dataPort.desc = ''Data''. Enthält die zuletzt erzeugte Zufallszahl.

antares.rgbLed.dataPort.desc = Der Datenwert, der die angezeigte Farbe definiert. Bit 0..7 bestimmen den Rot-Anteil, Bit 8..15 den Grün-Anteil, Bit 16..23 den Blau-Anteil.


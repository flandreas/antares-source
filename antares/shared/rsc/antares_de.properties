library.element.GraphInput.desc = Übernimmt ein Eingangssignal von der umgebenden Schaltung
library.element.GraphOutput.name = Ausgang
library.element.GraphOutput.desc = Gibt ein Ausgangssignal an die umgebende Schaltung weiter
library.element.BidirectionalSplitter.name = Bidirektionaler Verteiler
library.element.BidirectionalSplitter.desc = Verbindet Leitungen unterschiedlicher Breite in beiden Richtungen
library.element.Splitter.name = Verteiler
library.element.Splitter.desc = Teilt eine breite Leitung in mehrere schmalere Leitungen auf
library.element.Concentrator.name = Konzentrierer
library.element.Concentrator.desc = Fasst mehrere schmale Leitungen zu einer breiteren Leitungen zusammen
library.element.Constant.name = Konstante
library.element.Constant.desc = Stellt am Ausgang einen konstanten Wert zur Verfügung
library.element.Probe.name = Sonde
library.element.Probe.desc = Zeigt den Wert eines Signals auf einer Leitung an
library.element.ROM.name = ROM
library.element.ROM.desc = Nur-Lese-Speicher. Wenn CS gesetzt ist, gibt das ROM am Ausgang D die Daten der Speicherzelle mit Adresse A aus
library.element.RAM.name = RAM
library.element.RAM.desc = Schreib-Lese-Speicher. Gibt die Daten an Adresse A am Ausgang D aus, wenn WR 0 ist, oder speichert die Daten am Eingang D in Adresse A, wenn WR 1 ist.
library.element.Delay.name = Verzögerungsglied
library.element.Delay.desc = Verzögert eine Signaländerung um eine bestimmte Zeit
library.element.SignalSource.name = Signalquelle
library.element.Tunnel.name = Tunnel
library.element.Tunnel.desc = Transportiert ein Signal zu anderen Tunnel gleichen Namens
library.element.LEDMatrix.name = LED-Matrix
library.element.LEDMatrix.desc = Eine Matrix von Lichpunkten, die über Zeilen- und Spalten-Bits gesteuert wird
library.element.Random.name = Zufallsgenerator
library.element.Random.desc = Erzeugt bei steigender Flanke des Eingangs eine neue Zufallszahl
library.element.DipSwitch.name = DIP-Schalter
library.element.DipSwitch.desc = Eine konfigurierbare Anzahl kleiner Schalter
library.element.Keyboard.name = Tastatur
library.element.Keyboard.desc = Wandelt Tasteneingaben in die entsprechenden 7-Bit ASCII-Codes um
library.element.Terminal.name = Terminal
library.element.Terminal.desc = Stellt Zeichen im 7-Bit ASCII-Code dar
library.element.VideoRam.name = Video RAM
library.element.VideoRam.desc = Stellt den Inhalt des RAM als Bild dar, wobei Speicherwerte als Index in einer Farbtabelle verwendet werden
library.element.Break.name = Breakpoint
library.element.Break.desc = Hält Einzelschritt-Simulation bei der gewünschten Signalflanke an
library.element.Break.logic.name = Breakpoint
library.element.Break.logic.desc = Mit dem Wert "Positiv" wird der Breakpoint durch das Signal 1 aktviert. Der Wert "Negativ" kehrt diese Logik um: Das Signal 0 aktiviert den Breakpoint.
library.element.PullResistor.name = Pull-Widerstand
library.element.PullResistor.low.desc = Zieht eine Leitung mit undefiniertem Signal auf 0
library.element.PullResistor.high.desc = Zieht eine Leitung mit undefiniertem Signal auf 1
library.element.Transistor.name = Transistor
library.element.Transistor.desc = Ein elektronischer Schalter, der ein Signal vom Source-Eingang zum Drain-Ausgang weiterleitet, falls der Gate-Eingang aktiv ist
library.element.Transistor.nType.name = Transistor N-Typ
library.element.Transistor.nType.desc = Leitet das Signal vom Source-Eingang zum Drain-Ausgang weiter, falls Gate 1 ist
library.element.Transistor.pType.name = Transistor P-Typ
library.element.Transistor.pType.desc = Leitet das Signal vom Source-Eingang zum Drain-Ausgang weiter, falls Gate 0 ist
library.element.Ground.name = Masse
library.element.Ground.desc = Stellt am Ausgang den Wert 0 zur Verfügung
library.element.Power.name = Stromversorgung
library.element.Power.desc = Stellt am Ausgang den Wert 1 zur Verfügung
library.element.Joystick.name = Joystick
library.element.Joystick.desc = Übersetzt die Auslenkung des Joysticks in x- und y-Signale
library.element.RealSwitch.name = Echter Schalter
library.element.RealSwitch.desc = Ein bidirektionaler Schalter mit zwei Anschlüssen
library.element.BitExtender.name = Bit-Erweiterung
library.element.BitExtender.desc = Erweitert die Bit-Breite eines Signals unter Erhaltung des Vorzeichens
library.element.Buzzer.name = Tongeber
library.element.Buzzer.desc = Erzeugt Töne einer bestimmten Frequenz und Lautstärke

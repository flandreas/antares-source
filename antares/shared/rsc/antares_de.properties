application.welcome.text = Falls Du Antares zum ersten Mal benützt, möchtest Du vielleicht \
  das <a href=\"https://www.antarescircuit.io/user-manual/english/first-steps/first-steps\">"Erste Schritte"</a>-Tutorial lesen, um zu lernen, wie Antares verwendet wird.<br><br> \
  Als Alternative dazu findest Du auf YouTube unser <a href=\"https://youtu.be/JNdY6b4nTb0\">"Einführungs-Video"</a>.<br><br> \
  Falls Du einen Fehler in Antares findest oder ein Feature vermisst, \
  würden wir uns freuen, wenn Du in unserem <a href=\"https://github.com/flandreas/antares\">"GitHub-Project"</a> \
  ein Issue eröffnest oder eine Diskussion startest, oder eine Mail an <a href="mailto:andreas@antarescircuit.io">andreas@antarescircuit.io</a> sendest. <br><br> \
  Viel Spass mit Antares!

